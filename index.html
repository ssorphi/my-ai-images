<!DOCTYPE html>
<html lang="en">
<body style="text-align:center; font-family:sans-serif; background:#f0f2f5; padding:50px;">
    <h1 style="color:#1a73e8;">✨ My AI Image Creator</h1>
    <p>Type one word and I'll do the rest!</p>
    
    <input type="text" id="userWord" placeholder="e.g. wooden bench" style="padding:15px; width:250px; border-radius:10px; border:2px solid #1a73e8;">
    <button onclick="generate()" style="padding:15px 25px; cursor:pointer; background:#1a73e8; color:white; border:none; border-radius:10px; font-weight:bold; transition: 0.3s;">Create!</button>
    
    <div style="margin-top:30px;">
        <p id="loading" style="display:none; font-weight:bold; color:#555;">The AI artist is working... 🎨</p>
        <div id="imageContainer"></div>
    </div>

    <script>
        function generate() {
            const word = document.getElementById('userWord').value;
            const container = document.getElementById('imageContainer');
            const loading = document.getElementById('loading');
            
            if(!word) { alert("Please type a word!"); return; }

            loading.style.display = "block";
            container.innerHTML = ""; 

            const magicPrompt = word + ", close up 40 percent, beautiful nature background, cinematic lighting, high quality";
            const encodedPrompt = encodeURIComponent(magicPrompt);
            
            const randomSeed = Math.floor(Math.random() * 1000000);
            const imageUrl = "https://pollinations.ai" + encodedPrompt + "?seed=" + randomSeed + "&nologo=true";
            
            const newImg = new Image();
            newImg.src = imageUrl;
            newImg.style.maxWidth = "100%";
            newImg.style.borderRadius = "15px";
            newImg.style.boxShadow = "0 8px 24px rgba(0,0,0,0.2)";
            
            newImg.onload = function() {
                loading.style.display = "none";
                container.appendChild(newImg);
            }
        }
    </script>
</body>
</html>
