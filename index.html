<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My AI Creator</title>
</head>
<body style="text-align:center; font-family:sans-serif; background:#f9f7ff; padding:50px;">
    <h1 style="color:#6200ea;">✨ My AI Image Creator</h1>
    <p>Type one word and I'll do the rest!</p>
    
    <input type="text" id="userWord" placeholder="e.g. wooden bench" style="padding:15px; width:250px; border-radius:10px; border:2px solid #6200ea; outline:none;">
    <button onclick="generate()" style="padding:15px 25px; cursor:pointer; background:#6200ea; color:white; border:none; border-radius:10px; font-weight:bold; box-shadow: 0 4px 10px rgba(98,0,234,0.3);">Create!</button>
    
    <div style="margin-top:40px;">
        <p id="loading" style="display:none; font-weight:bold; color:#6200ea;">The AI artist is working... 🎨</p>
        <div id="imageContainer"></div>
    </div>

    <script>
        function generate() {
            const word = document.getElementById('userWord').value;
            const container = document.getElementById('imageContainer');
            const loading = document.getElementById('loading');
            
            if(!word) { alert("Please type a word!"); return; }

            loading.style.display = "block";
            container.innerHTML = ""; 

            // Your Secret Recipe: 40% close up + nature
            const magicPrompt = word + ", close up 40 percent, beautiful nature background, cinematic lighting, 8k high resolution";
            const encodedPrompt = encodeURIComponent(magicPrompt);
            
            // Adding a random seed ensures it doesn't get stuck!
            const randomSeed = Math.floor(Math.random() * 1000000);
            const imageUrl = "https://pollinations.ai" + encodedPrompt + "?seed=" + randomSeed + "&nologo=true";
            
            const newImg = new Image();
            newImg.src = imageUrl;
            newImg.style.maxWidth = "100%";
            newImg.style.borderRadius = "20px";
            newImg.style.boxShadow = "0 15px 40px rgba(0,0,0,0.2)";
            
            newImg.onload = function() {
                loading.style.display = "none";
                container.appendChild(newImg);
            }
        }
    </script>
</body>
</html>
